spring:
  servlet:
    multipart:
      # 파일 자체 상한은 10 MiB로 유지하고 multipart 경계·헤더를 위해 요청에는 1 MiB 여유를 둔다.
      max-file-size: 10MB
      max-request-size: 11MB
  application:
    name: tibero_mcp
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  ai:
    embedding:
      transformer:
        # 모델은 저장소가 아닌 사용자 로컬 캐시에 보관해 재시작 시 재다운로드를 피한다.
        cache:
          directory: ${APP_EMBEDDING_MODEL_CACHE_DIRECTORY:${user.home}/.cache/tibero-mcp/embedding-models}
        onnx:
          # multilingual-e5-small: 로컬 ONNX 추론, 한국어를 포함한 다국어 검색용, 384차원
          model-uri: https://huggingface.co/intfloat/multilingual-e5-small/resolve/614241f622f53c4eeff9890bdc4f31cfecc418b3/onnx/model.onnx
          model-output-name: last_hidden_state
        tokenizer:
          uri: https://huggingface.co/intfloat/multilingual-e5-small/resolve/614241f622f53c4eeff9890bdc4f31cfecc418b3/tokenizer.json
    mcp:
      server:
        name: tibero-mcp
        version: 0.0.1
        # Streamable HTTP(MCP 최신 규격) — 엔드포인트 기본값: /mcp
        protocol: STREAMABLE
        type: SYNC

app:
  document-upload:
    max-file-size-bytes: 10485760
    max-extracted-characters: 2000000
    max-pdf-pages: 1000
  embedding:
    dimension: 384
    # E5는 검색 역할을 구분하기 위해 문서와 질의에 각각 passage:/query: 접두사를 요구한다.
    prefix:
      document: "passage: "
      query: "query: "
    worker:
      # PENDING 문서를 폴링하는 주기(ms)와 한 번에 집어갈 문서 수(Outbox 소비자)
      poll-interval-ms: 5000
      initial-delay-ms: 0
      batch-size: 10
      # 한 번의 embedAll() 호출에 넣을 청크 수 상한(수백 페이지 문서 대비)
      embed-batch-size: 32
      retry:
        max-attempts: 3
        initial-backoff-ms: 1000
        max-backoff-ms: 60000
      lease:
        duration-ms: 120000
        reclaim-interval-ms: 30000
        reclaim-batch-size: 10
  chunking:
    size: 500
    overlap: 50
